<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PokéAPI</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="PokeApi.png" alt="PokeApi" class="logo">
    </div>
    <header>
        <h1>Buscador de Pokemones</h1>
        <p>Busca desde pokemones hasta las abilidades de los mismos.</p>
    </header>

    <section class="search-section">
        <form id="pokemon-form">
            <label for="search">Buscar:</label>
            <input type="text" id="search" name="search" value="">
            <div class="button-container">
                <button type="reset" id="reset-button" class="btn btn-reset" style="visibility: hidden;">Limpiar</button>
                <button type="submit" class="btn btn-submit">Buscar</button>
            </div>
        </form>
    </section>    
</div>

<div class="pokemon-info" id="pokemon-info">
    <div class="pokemon-container">
        <div class="left-section">
            <h2 id="pokemon-name">Nombre (id)</h2>
            <div class="Sprites">
                <h2>Sprites</h2>
                <img id="sprite1" src="" alt="">
                <img id="sprite2" src="" alt="">
            </div>
        </div>
        <div class="right-section">
            <div class="label">Weight / Height</div>
            <div class="values" id="pokemon-weight"></div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="main.js"></script>
</body>
</html>
