<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Números</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card text-center">
            <div class="card-header">
                <h1>Generador de Números</h1>
            </div>
            <div class="card-body">
                <div class="btn-group mb-3" role="group">
                    <button class="btn btn-primary" onclick="generateNumber()">Generar</button>
                    <button class="btn btn-secondary" onclick="sortNumbers('asc')">Ascendente</button>
                    <button class="btn btn-secondary" onclick="sortNumbers('desc')">Descendente</button>
                </div>
                <div id="number-list" class="d-flex flex-wrap justify-content-center"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
